        <text x="136" y="760" class="body">소리 · 빛 · 진동으로 이동한다.</text>
        <text x="136" y="830" class="small">이 프로젝트는 접근성 해결보다</text>
        <text x="136" y="878" class="small">재미있는 감각 전환 자체에서 출발했다.</text>
