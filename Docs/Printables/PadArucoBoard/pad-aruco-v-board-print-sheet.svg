<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <rect x="0" y="0" width="210" height="297" fill="white"/>
  <text x="15" y="14" font-family="Arial, sans-serif" font-size="7" font-weight="bold">Bell Ringer Pad ArUco V-Board Print Sheet</text>
  <text x="15" y="20" font-family="Arial, sans-serif" font-size="4.2">Print at 100% / actual size. Disable fit-to-page.</text>
  <text x="15" y="24" font-family="Arial, sans-serif" font-size="4.2">Dictionary for later tracking: DICT_ARUCO_ORIGINAL</text>
  <text x="15" y="28" font-family="Arial, sans-serif" font-size="4.2">Cut the full 60 x 60 mm square. Keep the 5 mm white border around each marker.</text>

  <g transform="translate(15 34)">
    <rect x="0" y="0" width="60" height="60" fill="white" stroke="black" stroke-width="0.5"/>
    <g transform="translate(5 5) scale(7.142857142857143)">
  <rect x="0" y="0" width="7" height="7" fill="black"/>
  <rect x="1" y="1" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="1" y="2" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="1" y="3" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="3" y="3" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="4" y="3" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="5" y="3" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="1" y="4" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="3" y="4" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="4" y="4" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="5" y="4" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="2" y="5" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="3" y="5" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="4" y="5" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
</g>
  </g>
  <text x="45" y="31.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="4">LEFT FACE / ID 23</text>

  <g transform="translate(85 34)">
    <rect x="0" y="0" width="60" height="60" fill="white" stroke="black" stroke-width="0.5"/>
    <g transform="translate(5 5) scale(7.142857142857143)">
  <rect x="0" y="0" width="7" height="7" fill="black"/>
  <rect x="1" y="1" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="1" y="2" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="2" y="3" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="5" y="3" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="2" y="4" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="3" y="4" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="4" y="4" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
  <rect x="2" y="5" width="1" height="1" fill="white" stroke="white" stroke-width="0.01" />
