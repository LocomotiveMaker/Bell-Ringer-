    <text x="860" y="340" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">종 방향, 이명 위치, 숲 엔딩 전환</text>
    <circle cx="770" cy="500" r="84" fill="#1DAF88" opacity="0.18"/>
    <circle cx="770" cy="500" r="58" fill="#1DAF88"/>
    <circle cx="770" cy="500" r="8.64" fill="#171A24"/><circle cx="770" cy="500" r="20.16" fill="none" stroke="#171A24" stroke-width="4.800000000000001" opacity="0.8"/><circle cx="770" cy="500" r="30.72" fill="none" stroke="#171A24" stroke-width="3.84" opacity="0.45"/>
    <text x="860" y="480" font-size="34" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">LED 빛</text>
    <text x="860" y="520" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">초록 종, 보라 이명, 파란 비, 시안 벽 노이즈</text>
