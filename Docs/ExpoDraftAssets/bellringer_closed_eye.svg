    <text x="860" y="660" font-size="34" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">패드 진동</text>
    <text x="860" y="700" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">종 탐지 보조, 이명 lock, 보스 이동 방향 안내</text>
    <rect x="86" y="780" width="1428" height="90" rx="20" fill="#111520" stroke="#3A415A" stroke-width="2"/>
    <text x="126" y="838" font-size="26" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">핵심: "눈을 감고도 다음 행동이 느껴지는가?"가 이 프로젝트의 가장 중요한 기준이다.</text>
  
