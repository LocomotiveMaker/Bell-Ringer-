  <text x="86" y="126" font-size="52" font-weight="700" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">눈을 감고 플레이하는 구조</text>
  <line x1="86" y1="154" x2="1514" y2="154" stroke="#3A415A" stroke-width="3"/>
  
    <text x="86" y="220" font-size="30" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">플레이어는 시각 UI가 아닌 소리, 빛, 진동, 머리 회전만으로 다음 행동을 결정한다.</text>
    <circle cx="360" cy="500" r="150" fill="#111520" stroke="#3A415A" stroke-width="4"/>
