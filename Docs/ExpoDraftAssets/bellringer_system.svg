    <text x="86" y="220" font-size="30" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">머리, 패드, 카메라, 관람 화면이 하나의 루프로 연결되어 플레이와 관람을 동시에 지원한다.</text>
