    <text x="168" y="496" fill="#148D6C" font-size="30" font-weight="900">01  개요</text>
    
      <text x="188" y="548" fill="#1F2D34" font-size="48" font-weight="900">플레이어는 보지 않고, 관람자는 한눈에 이해한다</text>
      <text x="188" y="612" fill="#667780" font-size="29">Bell Ringer는 종소리를 따라 이동하고, 패드 pose로 이명을 정화하며, 마지막에는 숲 소리로 귀환하는 체감형 전시 게임이다.</text>
      <text x="188" y="656" fill="#667780" font-size="29">플레이어는 청각과 빛, 진동만 받아들이고 관람자는 큰 흐름과 오브젝트 상태를 화면으로 본다.</text>
    
  

    
    <rect x="136" y="804" width="1528" height="404" rx="30" fill="#FFFDF8" stroke="#D8D0BE" stroke-width="2"/>
    <rect x="136" y="804" width="236" height="64" rx="30" fill="rgba(242,192,76,0.12)"/>
    <text x="168" y="846" fill="#F2C04C" font-size="30" font-weight="900">02  배경 및 목적</text>
    
      
        <circle cx="200" cy="880" r="10" fill="#F2C04C"/>
        <text x="230" y="892" fill="#1F2D34" font-size="29">눈을 감은 상태에서 방향을 인지하고 행동을 이어가는 감각 설계를 검증한다.</text>
      
        <circle cx="200" cy="948" r="10" fill="#F2C04C"/>
        <text x="230" y="960" fill="#667780" font-size="29">종, 비, 벽, 이명을 각기 다른 소리와 빛의 규칙으로 배치해 직관성을 높인다.</text>
      
        <circle cx="200" cy="1016" r="10" fill="#F2C04C"/>
        <text x="230" y="1028" fill="#667780" font-size="29">전시장에서 멀리서도 읽히도록 글보다 아이콘, 흐름선, 블록 구조를 우선한다.</text>
      
      
