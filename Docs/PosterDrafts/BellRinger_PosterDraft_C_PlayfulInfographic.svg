    <text x="136" y="162" fill="#148D6C" font-size="30" font-weight="800">MD / 체감기술(고급)</text>
    <text x="136" y="262" fill="#1F2D34" font-size="82" font-weight="900">Bell Ringer (종지기)</text>
    <text x="136" y="322" fill="#667780" font-size="34" font-weight="700">소리·빛·진동으로 길을 찾는 폐안형 인터랙션 게임</text>
    
