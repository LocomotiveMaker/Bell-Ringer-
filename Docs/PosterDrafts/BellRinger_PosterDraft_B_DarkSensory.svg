    <text x="1344" y="1072" fill="#A7B6D8" font-size="23">소리, 빛, 진동의 의미를</text>
    <text x="1344" y="1102" fill="#A7B6D8" font-size="23">단계마다 명확히 분리</text>
  
    
  

    
