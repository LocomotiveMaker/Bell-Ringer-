    <text x="110" y="118" fill="#33E0AA" font-size="30" font-weight="800">MD / 체감기술(고급)</text>
    <text x="110" y="216" fill="#F3F7FF" font-size="92" font-weight="900">Bell Ringer</text>
    <text x="110" y="278" fill="#A7B6D8" font-size="35" font-weight="700">눈을 감고 종소리와 빛, 진동만으로 길을 찾는 감각 중심 전시 게임</text>

    
    <rect x="84" y="360" width="1632" height="336" rx="32" fill="#10192D" stroke="#2A3959" stroke-width="2"/>
    <rect x="84" y="360" width="1632" height="72" rx="32" fill="#142038"/>
    <text x="118" y="408" fill="#F3F7FF" font-size="30" font-weight="900">01  개요</text>
    
      <text x="134" y="456" fill="#F3F7FF" font-size="54" font-weight="900">보이지 않아도 따라갈 수 있는가?</text>
      <text x="134" y="520" fill="#A7B6D8" font-size="29">종은 공간의 방향을 만들고, 비바람은 방해가 되며, 패드는 이명을 정화하는 도구가 된다.</text>
      
    <rect x="134" y="574" width="250" height="60" rx="30" fill="#142B2B" stroke="#33E0AA" stroke-width="2"/>
    <text x="259" y="614" text-anchor="middle" fill="#33E0AA" font-size="25" font-weight="800">눈 감고 플레이</text>
  
      
    <rect x="402" y="574" width="250" height="60" rx="30" fill="#14233A" stroke="#52A5FF" stroke-width="2"/>
    <text x="527" y="614" text-anchor="middle" fill="#52A5FF" font-size="25" font-weight="800">종소리 추적</text>
  
      
    <rect x="670" y="574" width="250" height="60" rx="30" fill="#261B39" stroke="#B38DFF" stroke-width="2"/>
    <text x="795" y="614" text-anchor="middle" fill="#B38DFF" font-size="25" font-weight="800">이명 정화</text>
  
      
    <rect x="938" y="574" width="250" height="60" rx="30" fill="#312516" stroke="#FFC46A" stroke-width="2"/>
    <text x="1063" y="614" text-anchor="middle" fill="#FFC46A" font-size="25" font-weight="800">보스 패턴</text>
  
      
    <rect x="1206" y="574" width="250" height="60" rx="30" fill="#162834" stroke="#89E4F2" stroke-width="2"/>
    <text x="1331" y="614" text-anchor="middle" fill="#89E4F2" font-size="25" font-weight="800">숲 엔딩</text>
  
    
  

    
    <rect x="84" y="728" width="1632" height="410" rx="32" fill="#10192D" stroke="#2A3959" stroke-width="2"/>
    <rect x="84" y="728" width="1632" height="72" rx="32" fill="#142038"/>
    <text x="118" y="776" fill="#F3F7FF" font-size="30" font-weight="900">02  배경 및 목적</text>
    
      <text x="134" y="826" fill="#F3F7FF" font-size="50" font-weight="900">시각 대신 감각 결합을 전면에 세운다</text>
      
        <circle cx="146" cy="882" r="10" fill="#FFD45D"/>
        <text x="176" y="894" fill="#F3F7FF" font-size="29">소리의 위치, LED 빛의 점멸, 진동의 세기가 한 덩어리의 감각처럼 동작하도록 설계했다.</text>
      
        <circle cx="146" cy="948" r="10" fill="#FFD45D"/>
        <text x="176" y="960" fill="#A7B6D8" font-size="29">플레이어는 눈을 감은 상태에서 체감 정보만 받아들이고, 관람자는 화면으로 그 과정을 이해한다.</text>
      
        <circle cx="146" cy="1014" r="10" fill="#FFD45D"/>
        <text x="176" y="1026" fill="#A7B6D8" font-size="29">조작은 복잡하지 않지만 감각 해석은 깊게 남도록, 종 추적과 이명 정화의 대비를 핵심으로 잡았다.</text>
      
      
