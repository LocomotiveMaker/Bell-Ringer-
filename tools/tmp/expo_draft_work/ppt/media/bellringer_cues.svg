<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">

    
  <rect x="0" y="0" width="1600" height="960" rx="42" fill="#171A24"/>
  <rect x="36" y="36" width="1528" height="888" rx="30" fill="#202434" stroke="#3A415A" stroke-width="3"/>
  <text x="86" y="126" font-size="52" font-weight="700" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">감각 매핑 / 관람 포인트</text>
  <line x1="86" y1="154" x2="1514" y2="154" stroke="#3A415A" stroke-width="3"/>
  
    <text x="86" y="220" font-size="30" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">색과 감각은 장식이 아니라 플레이어가 다음 행동을 판단하는 실질적 정보로 사용된다.</text>
    <rect x="110" y="300" width="600" height="500" rx="28" fill="#111520" stroke="#3A415A" stroke-width="2"/>
    <circle cx="180" cy="380" r="28" fill="#F6D44A"/>
    <text x="230" y="392" font-size="30" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">종 / 초록 계열</text>
    <text x="230" y="428" font-size="22" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">소리 위치 점 + 짧은 ripple, 방향 추적의 기준</text>
    <circle cx="180" cy="500" r="28" fill="#A97DFF"/>
    <text x="230" y="512" font-size="30" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">이명 / 보라 계열</text>
    <text x="230" y="548" font-size="22" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">패드 pose 정화 대상, 불안정한 소리와 결합</text>
    <circle cx="180" cy="620" r="28" fill="#4BA7FF"/>
    <text x="230" y="632" font-size="30" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">비 / 파란 계열</text>
    <text x="230" y="668" font-size="22" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">바닥형 패턴, 종소리 분리 난이도 상승</text>
    <circle cx="180" cy="740" r="28" fill="#90D8E5"/>
    <text x="230" y="752" font-size="30" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">벽 / 시안 노이즈</text>
    <text x="230" y="788" font-size="22" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">일반 이명 구간의 경계와 공간 감각 보조</text>
    <rect x="840" y="300" width="650" height="500" rx="28" fill="#111520" stroke="#3A415A" stroke-width="2"/>
    <text x="890" y="374" font-size="30" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">관람자가 보는 포인트</text>
    <text x="890" y="432" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">• 플레이어는 눈을 감고 있지만, 관람자는 화면에서 종과 이명의 위치를 본다.</text>
    <text x="890" y="480" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">• 플레이어의 몸 회전, 패드 위치, 빛 반응, 진동 타이밍이 함께 보인다.</text>
    <text x="890" y="528" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">• 청각 중심 인터랙션이 실제로 어떤 몸 동작을 유도하는지 설명하기 쉽다.</text>
    <text x="890" y="616" font-size="28" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">전시 포인트</text>
    <text x="890" y="668" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">폐안 상태에서 소리, 빛, 진동이 하나의 감각 체계로 묶이는 경험을 전달한다.</text>
    <text x="890" y="716" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">기존 시각 중심 게임과 달리 청각과 촉각을 주인공으로 세운다는 점이 차별점이다.</text>
  
</svg>