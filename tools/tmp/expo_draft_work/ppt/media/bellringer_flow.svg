  <line x1="86" y1="154" x2="1514" y2="154" stroke="#3A415A" stroke-width="3"/>
  
    <text x="86" y="220" font-size="30" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">Bell Ringer는 종 추적에서 시작해, 폐안 상태의 감각 적응과 이명 정화, 숲 엔딩으로 이어진다.</text>
