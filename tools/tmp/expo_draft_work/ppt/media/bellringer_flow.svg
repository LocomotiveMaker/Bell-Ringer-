      <text x="1340" y="500" text-anchor="middle" font-size="32" font-weight="700" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">이명 정화</text>
      <text x="1340" y="544" text-anchor="middle" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">패드 pose + 진동</text>
    <rect x="86" y="650" width="1428" height="188" rx="24" fill="#111520" stroke="#3A415A" stroke-width="2"/>
    <text x="126" y="720" font-size="28" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">핵심 포인트</text>
    <text x="126" y="772" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">• 사용자는 종소리의 방향을 듣고 실제로 이동한다.</text>
    <text x="126" y="814" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">• 비·바람 구간에서는 종소리를 분리해서 추적해야 한다.</text>
    <text x="126" y="856" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">• 종 획득 이후에는 패드의 위치·회전과 진동으로 이명을 정화한다.</text>
  
</svg>