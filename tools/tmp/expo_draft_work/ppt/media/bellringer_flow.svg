      <text x="440" y="544" text-anchor="middle" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">공간 음향 추적</text><line x1="830" y1="370" x2="950" y2="370" stroke="#A9B2C7" stroke-width="8" stroke-linecap="round"/><polygon points="920,352 970,370 920,388" fill="#A9B2C7"/>
