      <text x="740" y="500" text-anchor="middle" font-size="32" font-weight="700" fill="#F3F5F9" font-family="Malgun Gothic, Pretendard, Arial">비·바람</text>
      <text x="740" y="544" text-anchor="middle" font-size="24" fill="#A9B2C7" font-family="Malgun Gothic, Pretendard, Arial">칵테일 파티 효과</text><line x1="1130" y1="370" x2="1250" y2="370" stroke="#A9B2C7" stroke-width="8" stroke-linecap="round"/><polygon points="1220,352 1270,370 1220,388" fill="#A9B2C7"/>
